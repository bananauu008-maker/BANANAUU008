<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>과속카메라 알림</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#111;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden;}
#wrap{display:flex;flex-direction:column;width:100%;height:100%;}
#map{flex:1;width:100%;min-height:0;}
#speed-overlay{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:1000;text-align:center;background:rgba(0,0,0,0.7);border-radius:16px;padding:8px 24px;pointer-events:none;}
#speed-big{font-size:52px;font-weight:700;color:#fff;line-height:1;}
#speed-unit{font-size:14px;color:#aaa;margin-top:2px;}
#limit-info{font-size:13px;color:#ffaa44;margin-top:2px;}
#alert-box{display:none;position:fixed;top:0;left:0;right:0;background:#cc2200;color:#fff;text-align:center;padding:10px;font-size:20px;font-weight:700;z-index:9999;animation:blink 0.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.6}}
#status-bar{background:#1a1a1a;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #333;height:56px;flex-shrink:0;}
.stat{text-align:center;}
.stat-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px;}
.stat-value{font-size:20px;font-weight:700;color:#fff;margin-top:1px;}
.stat-value.warning{color:#ff4400;}
.stat-value.ok{color:#00cc66;}
#gps-status{font-size:11px;color:#888;text-align:center;}
#cam-count{font-size:10px;color:#555;margin-top:3px;}
#toggle-btn{position:fixed;top:12px;right:12px;z-index:1000;background:rgba(0,0,0,0.75);color:#fff;border:1px solid #555;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}
#follow-btn{position:fixed;bottom:80px;right:12px;z-index:1000;background:rgba(0,0,0,0.75);color:#fff;border:1px solid #555;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;}
.leaflet-container{background:#f0e8d8;}
</style>
</head>
<body>
<div id="alert-box">⚠️ <span id="alert-msg"></span></div>
<div id="speed-overlay">
  <div id="speed-big">--</div>
  <div id="speed-unit">km/h</div>
  <div id="limit-info"></div>
</div>
<div id="wrap">
  <div id="map"></div>
  <div id="status-bar">
    <div class="stat">
      <div class="stat-label">전방 카메라</div>
      <div class="stat-value" id="nearest-dist">--</div>
      <div style="font-size:10px;color:#888;">m</div>
    </div>
    <div class="stat">
      <div class="stat-label">제한속도</div>
      <div class="stat-value" id="nearest-limit">--</div>
      <div style="font-size:10px;color:#888;">km/h</div>
    </div>
    <div class="stat">
      <div id="gps-status">GPS 연결 중...</div>
      <div id="cam-count"></div>
    </div>
  </div>
</div>
<button id="toggle-btn" onclick="toggleSound()">🔊 ON</button>
<button id="follow-btn" onclick="toggleFollow()">📍 따라가기 ON</button>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<script src="cameras.js"></script>
<script>
const ALERT_DIST=1000;
const HEADING_TOLERANCE=60;
let map,myMarker,soundOn=true,audioCtx=null,lastAlertTime=0,currentSpeed=0;
let followMode=true,markerLayer=null;
let prevLat=null,prevLng=null,heading=null;

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playBeep(f,d,v){if(!soundOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;g.gain.value=v||0.4;o.start();o.stop(audioCtx.currentTime+d);}
function playSpeedAlert(){if(!audioCtx)return;playBeep(880,0.15,0.7);setTimeout(()=>playBeep(880,0.15,0.7),200);setTimeout(()=>playBeep(1100,0.3,0.8),400);}
function playCameraAlert(){if(!audioCtx)return;playBeep(550,0.2,0.4);setTimeout(()=>playBeep(550,0.2,0.4),300);}
function toggleSound(){initAudio();soundOn=!soundOn;document.getElementById('toggle-btn').textContent=soundOn?'🔊 ON':'🔇 OFF';}
function toggleFollow(){followMode=!followMode;document.getElementById('follow-btn').textContent=followMode?'📍 따라가기 ON':'📍 따라가기 OFF';}
function deg2rad(d){return d*Math.PI/180;}
function getDistance(a,b,c,d){const R=6371000,dL=deg2rad(c-a),dG=deg2rad(d-b),x=Math.sin(dL/2)**2+Math.cos(deg2rad(a))*Math.cos(deg2rad(c))*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function getBearing(lat1,lng1,lat2,lng2){
  const dLng=deg2rad(lng2-lng1);
  const y=Math.sin(dLng)*Math.cos(deg2rad(lat2));
  const x=Math.cos(deg2rad(lat1))*Math.sin(deg2rad(lat2))-Math.sin(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.cos(dLng);
  return(Math.atan2(y,x)*180/Math.PI+360)%360;
}
function angleDiff(a,b){let d=Math.abs(a-b)%360;return d>180?360-d:d;}

function renderMarkers(){
  if(!markerLayer)return;
  markerLayer.clearLayers();
  if(map.getZoom()<12)return;
  const b=map.getBounds();
  const s=b.getSouth(),n=b.getNorth(),w=b.getWest(),e=b.getEast();
  let cnt=0;
  for(let i=0;i<CAMERAS.length;i++){
    const c=CAMERAS[i];
    if(c[0]>s&&c[0]<n&&c[1]>w&&c[1]<e){
      const col=c[2]>0?'#ff4400':'#ff8800';
      L.circleMarker([c[0],c[1]],{radius:7,color:'#fff',weight:2,fillColor:col,fillOpacity:1})
        .bindPopup(c[2]>0?'과속단속 '+c[2]+'km/h':'신호단속')
        .addTo(markerLayer);
      cnt++;
      if(cnt>500)break;
    }
  }
}

window.addEventListener('load',()=>{
  map=L.map('map',{zoomControl:true,attributionControl:false,preferCanvas:true,rotate:true,touchRotate:false,rotateControl:{closeOnZeroBearing:false},bearing:0}).setView([37.2,127.1],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  markerLayer=L.layerGroup().addTo(map);
  map.on('moveend zoomend',renderMarkers);
  renderMarkers();
  document.getElementById('cam-count').textContent='카메라 '+CAMERAS.length.toLocaleString()+'개';
  map.on('dragstart',()=>{followMode=false;document.getElementById('follow-btn').textContent='📍 따라가기 OFF';});

  if(navigator.geolocation){
    navigator.geolocation.watchPosition(pos=>{
      const lat=pos.coords.latitude,lng=pos.coords.longitude;
      currentSpeed=pos.coords.speed?Math.round(pos.coords.speed*3.6):0;

      if(prevLat!==null){
        const moved=getDistance(prevLat,prevLng,lat,lng);
        if(moved>5)heading=getBearing(prevLat,prevLng,lat,lng);
      }
      prevLat=lat;prevLng=lng;

      document.getElementById('gps-status').textContent='● GPS 연결됨';
      document.getElementById('gps-status').style.color='#00cc66';
      document.getElementById('speed-big').textContent=currentSpeed;

      if(!myMarker){
        myMarker=L.circleMarker([lat,lng],{radius:10,color:'#fff',weight:3,fillColor:'#44aaff',fillOpacity:1}).addTo(map);
        map.setView([lat,lng],15);
      } else {
        myMarker.setLatLng([lat,lng]);
      }

      if(followMode){
        if(currentSpeed>=10){
          map.setView([lat,lng],16,{animate:true});
          if(heading!==null&&map.setBearing)map.setBearing(360-heading);
        } else {
          map.panTo([lat,lng],{animate:true});
        }
      }

      let nd=Infinity,nc=null;
      for(let i=0;i<CAMERAS.length;i++){
        const c=CAMERAS[i];
        const d=getDistance(lat,lng,c[0],c[1]);
        if(d>ALERT_DIST)continue;
        if(heading!==null&&currentSpeed>=10){
          const brg=getBearing(lat,lng,c[0],c[1]);
          if(angleDiff(heading,brg)>HEADING_TOLERANCE)continue;
        }
        if(d<nd){nd=d;nc=c;}
      }

      const distEl=document.getElementById('nearest-dist');
      const limitEl=document.getElementById('nearest-limit');
      const infoEl=document.getElementById('limit-info');

      if(nc){
        const dr=Math.round(nd);
        const limit=nc[2];
        distEl.textContent=dr;
        distEl.className='stat-value warning';
        limitEl.textContent=limit>0?limit:'신호';
        infoEl.textContent=limit>0?'제한 '+limit+'km/h':'신호단속 구간';

        const overLimit=limit>0&&currentSpeed>limit;
        document.getElementById('speed-big').style.color=overLimit?'#ff4400':'#ffffff';

        const ab=document.getElementById('alert-box'),now=Date.now();
        if(overLimit){
          ab.style.display='block';
          document.getElementById('alert-msg').textContent='과속! '+dr+'m 전방 카메라 — 제한 '+limit+'km/h';
          if(now-lastAlertTime>3000){playSpeedAlert();lastAlertTime=now;}
        } else {
          ab.style.display='none';
          if(currentSpeed>=10&&now-lastAlertTime>5000){playCameraAlert();lastAlertTime=now;}
        }
      } else {
        distEl.textContent='--';
        distEl.className='stat-value ok';
        limitEl.textContent='--';
        infoEl.textContent='';
        document.getElementById('speed-big').style.color='#ffffff';
        document.getElementById('alert-box').style.display='none';
      }
    },()=>{
      document.getElementById('gps-status').textContent='GPS 오류';
      document.getElementById('gps-status').style.color='#ff4400';
    },{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
  }
});
document.addEventListener('click',()=>initAudio(),{once:true});
</script>
</body>
</html>
