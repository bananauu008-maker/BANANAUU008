<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #fff; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #map { flex: 1; }
  #status-bar {
    background: #1a1a1a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #333;
    min-height: 64px;
    flex-shrink: 0;
  }
  #alert-box {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    background: #cc2200;
    color: #fff;
    text-align: center;
    padding: 14px;
    font-size: 22px;
    font-weight: 700;
    z-index: 9999;
    animation: blink 0.6s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.6} }
  .stat { text-align: center; }
  .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-size: 22px; font-weight: 700; color: #fff; margin-top: 2px; }
  .stat-value.warning { color: #ff4400; }
  .stat-value.ok { color: #00cc66; }
  #gps-status { font-size: 12px; color: #888; text-align: center; }
  .leaflet-container { background: #222; }
  #toggle-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 1000;
    background: rgba(0,0,0,0.75);
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
</style>

ght:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -7px; margin-top: -7px; width: 12px; height: 12px; transform: translate3d(2690px, 1543px, 0px); z-index: 1543;"><div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -7px; margin-top: -7px; width: 12px; height: 12px; transform: translate3d(2340px, 172px, 0px); z-index: 172;"><div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -7px; margin-top: -7px; width: 12px; height: 12px; transform: translate3d(2643px, 260px, 0px); z-index: 260;"><div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -7px; margin-top: -7px; width: 12px; height: 12px; transform: translate3d(2737px, 347px, 0px); z-index: 347;"><div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -7px; margin-top: -7px; width: 12px; height: 12px; transform: translate3d(2923px, -61px, 0px); z-index: -61;"><div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -7px; margin-top: -7px; width: 12px; height: 12px; transform: translate3d(2806px, 756px, 0px); z-index: 756;"><div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -7px; margin-top: -7px; width: 12px; height: 12px; transform: translate3d(2457px, -499px, 0px); z-index: -499;"><div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -7px; margin-top: -7px; width: 12px; height: 12px; transform: translate3d(2224px, 1252px, 0px); z-index: 1252;"><div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -7px; margin-top: -7px; width: 12px; height: 12px; transform: translate3d(3855px, -645px, 0px); z-index: -645;"><div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -7px; margin-top: -7px; width: 12px; height: 12px; transform: translate3d(3156px, -1229px, 0px); z-index: -1229;"><div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -7px; margin-top: -7px; width: 12px; height: 12px; transform: translate3d(3156px, 289px, 0px); z-index: 289;"><div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div></div><div class="leaflet-marker-icon leaflet-zoom-animated leaflet-interactive" tabindex="0" role="button" style="margin-left: -9px; margin-top: -9px; width: 12px; height: 12px; transform: translate3d(960px, 412px, 0px); z-index: 1412;"><div style="background:#4af;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px #4af"></div></div></div><div class="leaflet-pane leaflet-tooltip-pane"></div><div class="leaflet-pane leaflet-popup-pane"></div><div class="leaflet-proxy leaflet-zoom-animated" style="transform: translate3d(7.15818e+06px, 3.26499e+06px, 0px) scale(16384);"></div></div><div class="leaflet-control-container"><div class="leaflet-top leaflet-left"></div><div class="leaflet-top leaflet-right"></div><div class="leaflet-bottom leaflet-left"></div><div class="leaflet-bottom leaflet-right"></div></div></div>

<button id="toggle-btn" onclick="toggleSound()">🔊 ON</button>

<div id="status-bar">
  <div class="stat">
    <div class="stat-label">내 속도</div>
    <div class="stat-value" id="my-speed">--</div>
    <div style="font-size:11px;color:#888;">km/h</div>
  </div>
  <div class="stat">
    <div class="stat-label">가까운 카메라</div>
    <div class="stat-value ok" id="nearest-dist">3958</div>
    <div style="font-size:11px;color:#888;">m</div>
  </div>
  <div class="stat">
    <div class="stat-label">제한속도</div>
    <div class="stat-value" id="nearest-limit">60</div>
    <div style="font-size:11px;color:#888;">km/h</div>
  </div>
  <div class="stat">
    <div id="gps-status" style="color: rgb(0, 204, 102);">● GPS 연결됨</div>
    <div style="font-size:11px;color:#555;margin-top:4px;" id="cam-count">카메라 25개</div>
  </div>
</div>

<script>
const CAMERAS = [
  {lat:37.0068,lng:127.2699,limit:60,name:"안성 공도읍 만정리"},
  {lat:37.0101,lng:127.2801,limit:60,name:"안성 공도읍 용두리"},
  {lat:37.0023,lng:127.2604,limit:60,name:"안성 공도읍 내리"},
  {lat:37.0180,lng:127.2750,limit:80,name:"안성 공도읍 양기리"},
  {lat:37.0250,lng:127.2850,limit:80,name:"안성 공도 17번국도"},
  {lat:36.9950,lng:127.2600,limit:60,name:"안성 미양면"},
  {lat:36.9900,lng:127.2500,limit:60,name:"안성 미양면 계륵리"},
  {lat:37.0080,lng:127.2400,limit:60,name:"안성 원곡면"},
  {lat:37.0160,lng:127.2600,limit:60,name:"안성 38번국도"},
  {lat:37.0050,lng:127.2700,limit:60,name:"안성 공도 38번국도2"},
  {lat:37.0300,lng:127.2950,limit:80,name:"안성 1번국도 북"},
  {lat:36.9800,lng:127.2650,limit:60,name:"안성 1번국도 남"},
  {lat:37.0070,lng:127.3100,limit:80,name:"안성 서동대로"},
  {lat:37.0500,lng:127.2700,limit:100,name:"평택제천고속도로"},
  {lat:36.9650,lng:127.2700,limit:80,name:"안성 죽산면"},
  {lat:37.0120,lng:127.2550,limit:60,name:"안성시내 중앙로"},
  {lat:37.0090,lng:127.2680,limit:50,name:"안성시내 봉남로"},
  {lat:37.0060,lng:127.2720,limit:50,name:"안성시내 시장로"},
  {lat:37.0200,lng:127.2800,limit:60,name:"안성 보개면"},
  {lat:36.9920,lng:127.2750,limit:60,name:"안성 대덕면"},
  {lat:37.0350,lng:127.2600,limit:80,name:"안성 양성면"},
  {lat:36.9750,lng:127.2500,limit:60,name:"안성 일죽면"},
  {lat:37.0400,lng:127.3200,limit:80,name:"안성 고삼면"},
  {lat:37.0600,lng:127.2900,limit:80,name:"안성 금광면"},
  {lat:37.0080,lng:127.2900,limit:60,name:"안성 공도 동쪽"},
];

const ALERT_DIST = 300;
const WARN_DIST = 500;

let map, myMarker, myCircle, soundOn = true;
let watchId = null;
let lastAlertTime = 0;
let audioCtx = null;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playBeep(freq, duration, vol) {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = freq;
  gain.gain.value = vol || 0.4;
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playAlert(dist) {
  if (!audioCtx) return;
  if (dist < 150) {
    playBeep(880, 0.2, 0.6);
    setTimeout(() => playBeep(880, 0.2, 0.6), 250);
    setTimeout(() => playBeep(880, 0.2, 0.6), 500);
  } else if (dist < 300) {
    playBeep(660, 0.25, 0.5);
    setTimeout(() => playBeep(660, 0.25, 0.5), 350);
  } else {
    playBeep(440, 0.3, 0.4);
  }
}

function toggleSound() {
  if (!audioCtx) initAudio();
  soundOn = !soundOn;
  document.getElementById('toggle-btn').textContent = soundOn ? '🔊 ON' : '🔇 OFF';
}

function deg2rad(d) { return d * Math.PI / 180; }
function getDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = deg2rad(lat2 - lat1);
  const dLng = deg2rad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([37.007, 127.270], 14);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19
  }).addTo(map);

  const camIcon = L.divIcon({
    html: '<div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #ff4400"></div>',
    className: '', iconAnchor: [7, 7]
  });

  CAMERAS.forEach(cam => {
    L.marker([cam.lat, cam.lng], {icon: camIcon})
      .bindPopup(`<b>${cam.name}</b><br>제한속도: ${cam.limit}km/h`)
      .addTo(map);
    L.circle([cam.lat, cam.lng], {radius: ALERT_DIST, color:'#ff4400', fillColor:'#ff4400', fillOpacity:0.08, weight:1}).addTo(map);
  });

  document.getElementById('cam-count').textContent = `카메라 ${CAMERAS.length}개`;
}

function updatePosition(pos) {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : null;

  document.getElementById('gps-status').textContent = '● GPS 연결됨';
  document.getElementById('gps-status').style.color = '#00cc66';
  if (speed !== null) {
    document.getElementById('my-speed').textContent = speed;
  }

  if (!myMarker) {
    const myIcon = L.divIcon({
      html: '<div style="background:#4af;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px #4af"></div>',
      className: '', iconAnchor: [9, 9]
    });
    myMarker = L.marker([lat, lng], {icon: myIcon, zIndexOffset: 1000}).addTo(map);
    myCircle = L.circle([lat, lng], {radius: 30, color:'#4af', fillColor:'#4af', fillOpacity:0.2, weight:1}).addTo(map);
    map.setView([lat, lng], 15);
  } else {
    myMarker.setLatLng([lat, lng]);
    myCircle.setLatLng([lat, lng]);
    map.panTo([lat, lng]);
  }

  let nearestDist = Infinity, nearestCam = null;
  CAMERAS.forEach(cam => {
    const d = getDistance(lat, lng, cam.lat, cam.lng);
    if (d < nearestDist) { nearestDist = d; nearestCam = cam; }
  });

  const distRounded = Math.round(nearestDist);
  document.getElementById('nearest-dist').textContent = distRounded < 9999 ? distRounded : '--';
  document.getElementById('nearest-limit').textContent = nearestCam ? nearestCam.limit : '--';

  const distEl = document.getElementById('nearest-dist');
  if (nearestDist < ALERT_DIST) {
    distEl.className = 'stat-value warning';
  } else if (nearestDist < WARN_DIST) {
    distEl.className = 'stat-value';
  } else {
    distEl.className = 'stat-value ok';
  }

  const alertBox = document.getElementById('alert-box');
  const now = Date.now();
  if (nearestDist < ALERT_DIST) {
    alertBox.style.display = 'block';
    document.getElementById('alert-dist').textContent = distRounded;
    if (now - lastAlertTime > 4000) {
      playAlert(nearestDist);
      lastAlertTime = now;
    }
  } else {
    alertBox.style.display = 'none';
  }
}

function gpsError(err) {
  document.getElementById('gps-status').textContent = '⚠ GPS 오류';
  document.getElementById('gps-status').style.color = '#ff4400';
}

document.addEventListener('click', () => {
  if (!audioCtx) initAudio();
}, { once: true });

initMap();

if (navigator.geolocation) {
  watchId = navigator.geolocation.watchPosition(updatePosition, gpsError, {
    enableHighAccuracy: true,
    maximumAge: 2000,
    timeout: 10000
  });
} else {
  document.getElementById('gps-status').textContent = 'GPS 미지원';
}
</script>
