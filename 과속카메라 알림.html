<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>과속카메라 알림</title>
<script type="text/javascript" src="file://dapi.kakao.com/v2/maps/sdk.js?appkey=c8e21e0849f5e017681673ecff7c4d3e"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #fff; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #map { flex: 1; }
  #alert-box {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    background: #cc2200;
    color: #fff;
    text-align: center;
    padding: 14px;
    font-size: 22px;
    font-weight: 700;
    z-index: 9999;
    animation: blink 0.6s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.65} }
  #status-bar {
    background: #1a1a1a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #333;
    min-height: 64px;
    flex-shrink: 0;
  }
  .stat { text-align: center; }
  .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-size: 22px; font-weight: 700; color: #fff; margin-top: 2px; }
  .stat-value.warning { color: #ff4400; }
  .stat-value.ok { color: #00cc66; }
  #gps-status { font-size: 12px; color: #888; text-align: center; }
  #cam-count { font-size: 11px; color: #555; margin-top: 4px; }
  #toggle-btn {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 1000;
    background: rgba(0,0,0,0.75);
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="alert-box">⚠️ 과속카메라 <span id="alert-dist"></span>m 전방!</div>
<div id="map"></div>
<button id="toggle-btn" onclick="toggleSound()">🔊 ON</button>

<div id="status-bar">
  <div class="stat">
    <div class="stat-label">내 속도</div>
    <div class="stat-value" id="my-speed">--</div>
    <div style="font-size:11px;color:#888;">km/h</div>
  </div>
  <div class="stat">
    <div class="stat-label">가까운 카메라</div>
    <div class="stat-value" id="nearest-dist">--</div>
    <div style="font-size:11px;color:#888;">m</div>
  </div>
  <div class="stat">
    <div class="stat-label">제한속도</div>
    <div class="stat-value" id="nearest-limit">--</div>
    <div style="font-size:11px;color:#888;">km/h</div>
  </div>
  <div class="stat">
    <div id="gps-status" style="color: rgb(0, 204, 102);">● GPS 연결됨</div>
    <div id="cam-count"></div>
  </div>
</div>

<script>
const CAMERAS = [
  {lat:37.0068,lng:127.2699,limit:60,name:"안성 공도읍 만정리"},
  {lat:37.0101,lng:127.2801,limit:60,name:"안성 공도읍 용두리"},
  {lat:37.0023,lng:127.2604,limit:60,name:"안성 공도읍 내리"},
  {lat:37.0180,lng:127.2750,limit:80,name:"안성 공도읍 양기리"},
  {lat:37.0250,lng:127.2850,limit:80,name:"안성 공도 17번국도"},
  {lat:36.9950,lng:127.2600,limit:60,name:"안성 미양면"},
  {lat:36.9900,lng:127.2500,limit:60,name:"안성 미양면 계륵리"},
  {lat:37.0080,lng:127.2400,limit:60,name:"안성 원곡면"},
  {lat:37.0160,lng:127.2600,limit:60,name:"안성 38번국도"},
  {lat:37.0050,lng:127.2700,limit:60,name:"안성 공도 38번국도2"},
  {lat:37.0300,lng:127.2950,limit:80,name:"안성 1번국도 북"},
  {lat:36.9800,lng:127.2650,limit:60,name:"안성 1번국도 남"},
  {lat:37.0070,lng:127.3100,limit:80,name:"안성 서동대로"},
  {lat:37.0500,lng:127.2700,limit:100,name:"평택제천고속도로"},
  {lat:36.9650,lng:127.2700,limit:80,name:"안성 죽산면"},
  {lat:37.0120,lng:127.2550,limit:60,name:"안성시내 중앙로"},
  {lat:37.0090,lng:127.2680,limit:50,name:"안성시내 봉남로"},
  {lat:37.0060,lng:127.2720,limit:50,name:"안성시내 시장로"},
  {lat:37.0200,lng:127.2800,limit:60,name:"안성 보개면"},
  {lat:36.9920,lng:127.2750,limit:60,name:"안성 대덕면"},
  {lat:37.0350,lng:127.2600,limit:80,name:"안성 양성면"},
  {lat:36.9750,lng:127.2500,limit:60,name:"안성 일죽면"},
  {lat:37.0400,lng:127.3200,limit:80,name:"안성 고삼면"},
  {lat:37.0600,lng:127.2900,limit:80,name:"안성 금광면"},
  {lat:37.0080,lng:127.2900,limit:60,name:"안성 공도 동쪽"},
];

const ALERT_DIST = 300;
const WARN_DIST = 500;

let map, myMarker, soundOn = true, audioCtx = null, lastAlertTime = 0;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playBeep(freq, duration, vol) {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.value = freq; gain.gain.value = vol || 0.4;
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playAlert(dist) {
  if (!audioCtx) return;
  if (dist < 150) {
    playBeep(880,0.2,0.6); setTimeout(()=>playBeep(880,0.2,0.6),250); setTimeout(()=>playBeep(880,0.2,0.6),500);
  } else if (dist < 300) {
    playBeep(660,0.25,0.5); setTimeout(()=>playBeep(660,0.25,0.5),350);
  } else {
    playBeep(440,0.3,0.4);
  }
}
function toggleSound() {
  initAudio();
  soundOn = !soundOn;
  document.getElementById('toggle-btn').textContent = soundOn ? '🔊 ON' : '🔇 OFF';
}

function deg2rad(d) { return d * Math.PI / 180; }
function getDistance(lat1,lng1,lat2,lng2) {
  const R=6371000, dLat=deg2rad(lat2-lat1), dLng=deg2rad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function initMap(lat, lng) {
  const center = new kakao.maps.LatLng(lat, lng);
  map = new kakao.maps.Map(document.getElementById('map'), { center, level: 5 });

  // 카메라 마커들
  CAMERAS.forEach(cam => {
    const pos = new kakao.maps.LatLng(cam.lat, cam.lng);

    // 경고 반경 원
    new kakao.maps.Circle({
      map,
      center: pos,
      radius: ALERT_DIST,
      strokeWeight: 1,
      strokeColor: '#ff4400',
      strokeOpacity: 0.4,
      fillColor: '#ff4400',
      fillOpacity: 0.07
    });

    // 카메라 마커 (커스텀)
    const content = `<div style="background:#ff4400;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(255,68,0,0.8);margin-top:-7px;margin-left:-7px;"></div>`;
    new kakao.maps.CustomOverlay({ map, position: pos, content, zIndex: 3 });

    // 제한속도 라벨
    const label = `<div style="background:rgba(0,0,0,0.7);color:#ffaa88;font-size:11px;padding:2px 5px;border-radius:4px;white-space:nowrap;margin-top:6px;margin-left:-15px;">${cam.limit}km/h</div>`;
    new kakao.maps.CustomOverlay({ map, position: pos, content: label, zIndex: 2 });
  });

  document.getElementById('cam-count').textContent = '카메라 ' + CAMERAS.length + '개';
}

function updatePosition(pos) {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : null;

  document.getElementById('gps-status').textContent = '● GPS 연결됨';
  document.getElementById('gps-status').style.color = '#00cc66';
  if (speed !== null) document.getElementById('my-speed').textContent = speed;

  const latlng = new kakao.maps.LatLng(lat, lng);

  if (!map) {
    initMap(lat, lng);
  } else {
    map.panTo(latlng);
  }

  if (!myMarker) {
    const content = `<div style="background:#44aaff;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px rgba(68,170,255,0.8);margin-top:-9px;margin-left:-9px;"></div>`;
    myMarker = new kakao.maps.CustomOverlay({ map, position: latlng, content, zIndex: 10 });
  } else {
    myMarker.setPosition(latlng);
  }

  // 가장 가까운 카메라 계산
  let nearestDist = Infinity, nearestCam = null;
  CAMERAS.forEach(cam => {
    const d = getDistance(lat, lng, cam.lat, cam.lng);
    if (d < nearestDist) { nearestDist = d; nearestCam = cam; }
  });

  const dr = Math.round(nearestDist);
  document.getElementById('nearest-dist').textContent = dr < 9999 ? dr : '--';
  document.getElementById('nearest-limit').textContent = nearestCam ? nearestCam.limit : '--';

  const distEl = document.getElementById('nearest-dist');
  distEl.className = nearestDist < ALERT_DIST ? 'stat-value warning' : nearestDist < WARN_DIST ? 'stat-value' : 'stat-value ok';

  const alertBox = document.getElementById('alert-box');
  const now = Date.now();
  if (nearestDist < ALERT_DIST) {
    alertBox.style.display = 'block';
    document.getElementById('alert-dist').textContent = dr;
    if (now - lastAlertTime > 4000) { playAlert(nearestDist); lastAlertTime = now; }
  } else {
    alertBox.style.display = 'none';
  }
}

function gpsError() {
  document.getElementById('gps-status').textContent = '⚠ GPS 오류';
  document.getElementById('gps-status').style.color = '#ff4400';
  // GPS 없으면 안성 중심으로 지도 초기화
  if (!map) initMap(37.007, 127.270);
}

document.addEventListener('click', () => initAudio(), { once: true });

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(updatePosition, gpsError, {
    enableHighAccuracy: true, maximumAge: 2000, timeout: 10000
  });
} else {
  document.getElementById('gps-status').textContent = 'GPS 미지원';
  initMap(37.007, 127.270);
}
</script>


</body></html>
